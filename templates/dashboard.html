<!DOCTYPE html>
<html>
<head>
    <title>Dashboard</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">

    <nav class="navbar navbar-expand-lg navbar-dark bg-dark px-4">

        <a class="navbar-brand" href="/">Task Manager</a>

        <div class="ms-auto">

            <a href="/register" class="btn btn-outline-light me-2">Register</a>

            <a href="/login" class="btn btn-outline-light me-2">Login</a>

            <a href="/create-task" class="btn btn-outline-light me-2">Create Task</a>

            <a href="/dashboard" class="btn btn-outline-light">Dashboard</a>

        </div>

    </nav>


    <div class="container mt-5">

        <h1 class="text-center mb-5">
            All Tasks
        </h1>

        <div class="row">

            {% for task in tasks %}

            <div class="col-md-6 mb-4">

                <div class="card shadow rounded-4 p-4 h-100">

                    <h3 class="mb-3">
                        {{ task[1] }}
                    </h3>

                    <p>
                        {{ task[2] }}
                    </p>

                    <p>
                        <strong>Priority:</strong>
                        {{ task[3] }}
                    </p>

                    <p>
                        <strong>Status:</strong>
                        {{ task[4] }}
                    </p>

                    <p>
                        <strong>Assigned To:</strong>
                        {{ task[5] }}
                    </p>
                     <!-- 
                      <p>
                      <strong>Assigned By:</strong>
                      {{ task[6] if task|length > 6 else 'N/A' }}
                    </p>  -->
                    <!-- UPDATE STATUS -->

                    <form method="POST"
                          action="/update-status/{{ task[0] }}">

                        <div class="mb-3">

                            <select name="status"
                                    class="form-select">

                                <option>Pending</option>

                                <option>In Progress</option>

                                <option>Completed</option>

                            </select>

                        </div>

                        <button type="submit"
                                class="btn btn-info w-100">

                            Update Status

                        </button>

                    </form>


                    <!-- DELETE TASK -->

                    <form method="POST"
                          action="/delete-task/{{ task[0] }}">

                        <button type="submit"
                                class="btn btn-danger w-100 mt-3">

                            Delete Task

                        </button>

                    </form>

                </div>

            </div>

            {% endfor %}

        </div>

    </div>

</body>
</html>
